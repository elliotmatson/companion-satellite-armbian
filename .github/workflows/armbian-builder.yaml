jobs:
  # The build itself is shared with companion-armbian
  build:
    uses: elliotmatson/companion-armbian/.github/workflows/build-image.yaml@claude/bold-hopper-3ltrrs
    secrets: inherit
    with:
      armbian-board: ${{ inputs.armbian-board }}
      packer-template: companion-satellite.pkr.hcl
      packer-image: output-satellitepi/armbian-companion-satellite.img
      # install.sh only resolves build=stable to the latest release when branch is not also "stable"
      packer-vars: branch=${{ inputs.satellite-build == 'stable' && 'main' || 'stable' }} build=${{ inputs.satellite-build }}
      artifact-name: ${{ inputs.armbian-board }}-companion-satellite-${{ inputs.satellite-build }}
