name: Build armbian + build companion satellite

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      satellite-build:
        required: true
        type: string

      armbian-board:
        required: true
        type: string

    outputs:
      armbian-ref:
        description: armbian/build tag the image was built from
        value: ${{ jobs.build.outputs.armbian-ref }}

  workflow_dispatch:
    inputs:
      satellite-build:
        type: string
        description: Companion Satellite Version (e.g. v2.6.0, or "stable" for the latest)
        default: "stable"
        required: true

      armbian-board:
        type: choice
        description: "Board"
        default: "orangepizero3"
