name: Build Select Boards on Companion Update via Renovate

# Triggered when Renovate updates the Companion Satellite git submodule to a new tag.
# Builds Armbian images for a selected set of boards with the updated Companion Satellite included, then generates a release with the new images attached.
# Runs on push to main (rather than on PR merge) so that branch-automerged updates, which have no PR, also produce a release.

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - .gitmodules
  workflow_dispatch:

jobs:
  get-satellite-version:
    runs-on: ubuntu-latest
    outputs:
      satellite_version: ${{ steps.get-version.outputs.satellite_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Get Satellite Version from .gitmodules, including leading 'v'
        id: get-version
        run: |
          version="$(git config -f .gitmodules submodule.companion-satellite.branch)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected companion-satellite version in .gitmodules: '$version'"
            exit 1
          fi
          echo "satellite_version=$version" >> $GITHUB_OUTPUT

  build-matrix:
    needs: get-satellite-version
    strategy:
      fail-fast: false
      matrix:
        # arm64 boards only: packer's arm-image builder and the Satellite installer don't support 32-bit (armhf)
        armbian-board:
          - orangepizero2
          - orangepizero2w
          - orangepizero3
    uses: ./.github/workflows/armbian-builder.yaml
    secrets: inherit
    with:
      armbian-board: ${{ matrix.armbian-board }}
      satellite-build: ${{ needs.get-satellite-version.outputs.satellite_version }}

  build-release:
    needs:
      - get-satellite-version
      - build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SATELLITE_VERSION: ${{ needs.get-satellite-version.outputs.satellite_version }}
      ARMBIAN_REF: ${{ needs.build-matrix.outputs.armbian-ref }}
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "armbian-*"
          merge-multiple: true
          path: ./artifacts

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Armbian (Ubuntu Noble, minimal) images with [Companion Satellite $SATELLITE_VERSION](https://github.com/bitfocus/companion-satellite/releases/tag/$SATELLITE_VERSION) preinstalled, built from [armbian/build $ARMBIAN_REF](https://github.com/armbian/build/releases/tag/$ARMBIAN_REF)."
            echo
            echo "Flash the \`.img.xz\` for your board with balenaEtcher or Raspberry Pi Imager. Satellite's web UI is on port 9999, and a subset of its settings can be edited in \`/boot/satellite-config\` on the device."
            echo
            echo "SSH is enabled. Log in as \`root\` with password \`1234\`; you'll be required to set a new password on first login."
            echo
            echo "## Companion Satellite $SATELLITE_VERSION release notes"
            echo
            gh release view "$SATELLITE_VERSION" --repo bitfocus/companion-satellite --json body --jq .body \
              || echo "See https://github.com/bitfocus/companion-satellite/releases/tag/$SATELLITE_VERSION"
          } > release-notes.md
          cat release-notes.md

      - name: Create Release
        id: create-release
        uses: ncipollo/release-action@v1
        with:
          tag: "companion-update-${{ env.SATELLITE_VERSION }}"
          commit: ${{ github.sha }}
          name: "Companion Satellite Update ${{ env.SATELLITE_VERSION }}"
          artifacts: ./artifacts/*
          bodyFile: release-notes.md
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
